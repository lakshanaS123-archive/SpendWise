services:
  - type: web
    name: spendwise
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn myproject.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "127.0.0.1,localhost,testserver,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: spendwise-db
          property: connectionString
      - key: MONGODB_DATABASE
        value: spendwise
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EXCHANGE_RATE_API_URL
        value: https://open.er-api.com/v6/latest/USD
      - key: MEDIA_ROOT
        value: media

databases:
  - name: spendwise-db
    databaseName: spendwise
    user: spendwise_user
    plan: free
