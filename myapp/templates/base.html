
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SpendWise{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar" aria-label="Main navigation">
    <a href="/" class="logo">SpendWise<span>.</span></a>

    <button
        type="button"
        class="nav-toggle"
        id="navToggle"
        aria-label="Open navigation menu"
        aria-controls="navLinks"
        aria-expanded="false"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="nav-links" id="navLinks">
        <a href="/">Home</a>

        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'transaction_list' %}">Transactions</a>
            <a href="{% url 'budgets' %}">Budgets</a>
            <a href="{% url 'insights' %}">Insights</a>
            <a href="{% url 'learning' %}">Learn</a>

            <form
                method="post"
                action="{% url 'logout' %}"
                class="nav-logout-form"
            >
                {% csrf_token %}
                <button type="submit" class="nav-logout-button">
                    Logout
                </button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </div>
</nav>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    <p>SpendWise &copy; 2026 | Smart money management for students</p>
</footer>

<script src="{% static 'js/script.js' %}"></script>

</body>
</html>
